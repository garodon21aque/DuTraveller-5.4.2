<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#25211d"/><stop offset="1" stop-color="#090908"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#251f1a" stop-opacity=".97"/><stop offset="1" stop-color="#100e0c" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6d4c1e"/><stop offset=".5" stop-color="#d2a85a"/><stop offset="1" stop-color="#6d4c1e"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".75"/></filter>
    <style>
      .title{font-family:Georgia,serif;font-weight:bold;fill:#efdcae;letter-spacing:3px}
      .label{font-family:Georgia,serif;fill:#d8c49a}
      .small{font-family:Arial,sans-serif;fill:#a99b83}
      .name{font-family:Arial,sans-serif;font-weight:bold;fill:#eee7d7}
      .btn{fill:#29231d;stroke:#9b7539;stroke-width:2}
      .slot{fill:#171512;stroke:#57472e;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1150" cy="170" r="290" fill="#5b130f" opacity=".12"/>
  <circle cx="230" cy="780" r="350" fill="#113134" opacity=".12"/>
